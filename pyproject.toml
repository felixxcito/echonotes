[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echonotes"
version = "1.0.0"
description = "EchoNotes: transcripción musical de audio a MIDI y partituras con un modelo transformer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Equipo EchoNotes" }]
keywords = [
    "audio",
    "midi",
    "transcription",
    "music",
    "transformer",
    "sheet-music",
    "notation",
    "musicxml",
    "tablature",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    # PyTorch stopped publishing Intel-mac (darwin x86_64) wheels after 2.2.2,
    # which only has wheels up to Python 3.12: on Intel macs pin torch (and
    # NumPy 1.x, which torch 2.2.2 was compiled against) and run under
    # Python <= 3.12, e.g. `uvx --python 3.12 echonotes` (see README).
    # The non-Intel floors must exclude the Intel-capped versions, otherwise uv
    # unifies both branches on the old pin instead of forking the resolution.
    "torch>=2.3 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.0,<2.3 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=2 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.24,<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "einops>=0.4",
    "mido>=1.3",
    "packaging>=20.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.13",
    "typer>=0.10",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.29",
    "soundfile>=0.14.0",
    "beat-this>=1.1",  # Tempo and downbeat tracking
]

[project.urls]
# EchoNotes es una copia modificada de MuScriptor (Kyutai x Mirelo, licencia MIT).
Upstream = "https://github.com/muscriptor/muscriptor"

[project.scripts]
echonotes = "echonotes.main:main"

[tool.hatch.build]
# The built frontend is gitignored but must ship in the sdist/wheel so that
# `uvx echonotes serve` has a UI. Built by `pnpm build` in web/.
artifacts = ["echonotes/web_dist"]

[tool.hatch.build.targets.wheel]
packages = ["echonotes"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
]
notebooks = [
    "plotly>=5.20",
    "jupyterlab>=4.0",
]
